spring.application.name=Authifyy
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

spring.security.oauth2.client.registration.google.client-id=${OAUTH2CLIENT}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2SECRET}
spring.security.oauth2.client.registration.google.scope= profile, email

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=465
spring.mail.username=${SPRINGMAILSENDER}
spring.mail.password=${SPRINGMAILPASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.jwt.security-key=${JWTCODE}
spring.jwt.expiration=3600000

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
